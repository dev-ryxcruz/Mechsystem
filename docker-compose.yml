services:
  db:
    image: postgres:16-alpine
    container_name: mechsystem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mechsystem}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mechsystem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mechsystem-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-mechsystem};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Admin__InitialPassword: "${ADMIN_INITIAL_PASSWORD:-Admin@Mech2026!}"
    # Para popular o banco com dados realistas de demonstração (clientes, veículos, peças e O.S.),
    # descomente a linha abaixo ou execute: docker compose run --rm app --seed-demo
    # command: ["--seed-demo"]

volumes:
  postgres_data:
